<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    
    <div class="hero">
        <h1>welcome to my HouseHub!</h1>
        <p>We provide the best real estate options in your hands.</p>
    </div>

    <div class="login-card">
        <h2>sign in to my HouseHub</h2>

        <div class="login">
            <img src="google.png" alt="google" width="20"> 
            <img src="facbook.png" alt="facbook" width="20">
        </div>

        <form action="home.html" method="get">
            <input type="text" placeholder="Email or phone number" required>
            <input type="password" placeholder="Please enter your password" required>
            <a href="home.html">
            <button type="submit" class="btn-sign">SIGN IN</button>
        </a>

            <div class="form-option">
                <a href="home.html">Forgot password?</a>
                <label> <input type="checkbox">Remember Me</label>
            </div>

            <div class="divider">or</div>

            <button type="button" class="btn-signup">SIGN UP</button>
            
        </form>
    </div>

    <footer>

    </footer>
</body>
</html>
